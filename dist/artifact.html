<title>Drivetrain</title>
<style>
:root {
  --bg: #eef1f5;
  --ink: #16202c;
  --muted: #5b6b7c;
  --panel: #ffffff;
  --edge: #c6d0da;
  --accent: #d8541f;
}
:root:not([data-theme="light"]) { }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1520;
    --ink: #e8eef5;
    --muted: #93a3b5;
    --panel: #17202d;
    --edge: #2b394a;
    --accent: #ff7a3d;
  }
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg); color: var(--ink);
  font-family: ui-monospace, monospace;
  overflow-x: hidden;
}
#app {
  display: flex; flex-direction: column;
  height: 100%; max-width: 480px; margin: 0 auto;
  padding: 8px; gap: 8px;
}
#hud {
  display: flex; flex-wrap: wrap; justify-content: space-between;
  gap: 2px 12px;
  font-size: 11px; letter-spacing: 0.04em; color: var(--muted);
  background: var(--panel); border: 1px solid var(--edge);
  border-radius: 8px; padding: 8px 10px;
}
#hud b { color: var(--ink); font-weight: 700; }
#stage {
  position: relative; flex: 0 0 auto;
  height: 44vh; min-height: 180px;
}
#scene {
  display: block; width: 100%; height: 100%;
  background: var(--panel); border: 1px solid var(--edge); border-radius: 8px;
}
#overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 4px;
  pointer-events: none; text-align: center;
}
#result { font-size: 30px; font-weight: 700; letter-spacing: 0.06em; }
#newbest { font-size: 14px; color: var(--accent); font-weight: 700; }
#controls { display: flex; gap: 8px; flex: 1 1 auto; }
#controls button {
  flex: 1 1 0; min-width: 64px; min-height: 120px;
  font: inherit; font-size: 16px; font-weight: 700; letter-spacing: 0.08em;
  color: var(--ink); background: var(--panel);
  border: 2px solid var(--edge); border-radius: 12px;
  touch-action: none; user-select: none; -webkit-user-select: none;
}
#controls button.on { border-color: var(--accent); color: var(--accent); }
#start {
  min-height: 64px; font: inherit; font-size: 16px; font-weight: 700;
  letter-spacing: 0.08em; color: var(--bg); background: var(--ink);
  border: none; border-radius: 12px; touch-action: none;
}
</style>
<div id="app">
  <div id="hud">
    <span>BEST <b id="best">--</b></span>
    <span>TIME <b id="time">0.00s</b></span>
    <span>SPEED <b id="speed">0</b> km/h</span>
    <span>PLATFORM <b id="togo">1740 m</b></span>
  </div>
  <div id="stage">
    <canvas id="scene"></canvas>
    <div id="overlay">
      <div id="result"></div>
      <div id="newbest"></div>
    </div>
  </div>
  <div id="controls">
    <button id="brake" data-control="brake" type="button">BRAKE</button>
    <button id="throttle" data-control="throttle" type="button">THROTTLE</button>
  </div>
  <button id="start" type="button">START</button>
</div>
<script>
"use strict";

const K = {
  TRACK_LENGTH_M:     2000,
  PLATFORM_START_M:   1740,
  PLATFORM_END_M:     1900,
  THROTTLE_ACCEL:     2.5,
  BRAKE_DECEL:        2.5,
  COAST_DECEL:        0.15,
  MAX_SPEED:          40,
  STOP_EPSILON:       0.05,
  RIVAL_BRAKE_M:      1568,
  FIXED_DT:           1 / 60,
  MAX_FRAME_DELTA_MS: 50,
  STEP_MS:            1000 / 60
};

const S = {
  state: "IDLE",
  result: null,
  playerPos: 0, playerSpeed: 0, playerArmed: false,
  rivalPos: 0,  rivalSpeed: 0,  rivalArmed: false, rivalDone: false,
  steps: 0, elapsedMs: 0,
  bestMs: null, newBest: false,
  input: { throttle: false, brake: false }
};

function stepTrain(train, throttle, brake) {
  let a;
  if (brake)         a = -K.BRAKE_DECEL;
  else if (throttle) a =  K.THROTTLE_ACCEL;
  else               a = -K.COAST_DECEL;

  // The train moves first, then the speed changes. This order matches the
  // arithmetic in BRIEF.md section 3. The reverse order loses 0.34 m over a
  // full brake and check C1 fails.
  train.pos += train.speed * K.FIXED_DT;
  train.speed += a * K.FIXED_DT;
  if (train.speed > K.MAX_SPEED) train.speed = K.MAX_SPEED;
  if (a < 0 && train.speed < K.STOP_EPSILON) train.speed = 0;
  if (train.speed < 0) train.speed = 0;
}

function finish(result) {
  S.result = result;
  S.state = "RESULT";
  if (result === "WIN") recordBest(S.elapsedMs);
  render();   // the screen must show the result on the same step
}

function judge() {
  if (S.playerPos >= K.TRACK_LENGTH_M) {
    S.playerPos = K.TRACK_LENGTH_M;
    S.playerSpeed = 0;
    finish("OVERSHOT");
    return true;
  }
  if (S.playerArmed && S.playerSpeed === 0) {
    if (S.playerPos < K.PLATFORM_START_M)      finish("UNDERSHOT");
    else if (S.playerPos > K.PLATFORM_END_M)   finish("OVERSHOT");
    else                                        finish("WIN");
    return true;
  }
  return false;
}

function step() {
  if (S.state !== "RACING") return;

  S.steps += 1;
  S.elapsedMs = Math.round(S.steps * K.STEP_MS);

  const p = { pos: S.playerPos, speed: S.playerSpeed };
  stepTrain(p, S.input.throttle && !S.input.brake, S.input.brake);
  S.playerPos = p.pos; S.playerSpeed = p.speed;
  if (S.playerSpeed > 0) S.playerArmed = true;

  if (!S.rivalDone) {
    const r = { pos: S.rivalPos, speed: S.rivalSpeed };
    const braking = r.pos >= K.RIVAL_BRAKE_M;
    stepTrain(r, !braking, braking);
    S.rivalPos = r.pos; S.rivalSpeed = r.speed;
    if (S.rivalSpeed > 0) S.rivalArmed = true;
    if (S.rivalArmed && S.rivalSpeed === 0) S.rivalDone = true;
  }

  // The player is judged first. A stop on the same step wins.
  if (judge()) return;
  if (S.rivalDone) finish("RIVAL WINS");
}

function startRace() {
  S.state = "RACING";
  S.result = null;
  S.playerPos = 0; S.playerSpeed = 0; S.playerArmed = false;
  S.rivalPos = 0;  S.rivalSpeed = 0;  S.rivalArmed = false; S.rivalDone = false;
  S.steps = 0; S.elapsedMs = 0; S.newBest = false;
  S.input.throttle = false; S.input.brake = false;
}

function resetRace() {
  startRace();
  S.state = "IDLE";
}

function setInput(next) {
  if (typeof next.throttle === "boolean") S.input.throttle = next.throttle;
  if (typeof next.brake === "boolean")    S.input.brake = next.brake;
}

// ------------------------------------------------------------ the best time
// A storage error must never stop the game.

const BEST_KEY = "drivetrain.bestMs";

function readBest() {
  try {
    const raw = window.localStorage.getItem(BEST_KEY);
    if (raw === null) return null;
    const n = Number(raw);
    if (!Number.isInteger(n) || n <= 0) return null;
    return n;
  } catch (e) { return null; }
}

function writeBest(ms) {
  try { window.localStorage.setItem(BEST_KEY, String(ms)); } catch (e) { }
}

function recordBest(ms) {
  if (S.bestMs === null || ms < S.bestMs) {
    S.bestMs = ms;
    S.newBest = true;
    writeBest(ms);
  }
}

S.bestMs = readBest();

// ---------------------------------------------------------------- rendering
// render() reads the state. render() never writes the state.

const el = {
  best:    document.getElementById("best"),
  time:    document.getElementById("time"),
  result:  document.getElementById("result"),
  newbest: document.getElementById("newbest"),
  start:   document.getElementById("start"),
  brake:   document.getElementById("brake"),
  throttle: document.getElementById("throttle"),
  speed:   document.getElementById("speed"),
  togo:    document.getElementById("togo"),
  scene:   document.getElementById("scene")
};

function secs(ms) { return (ms / 1000).toFixed(2) + "s"; }

function setText(node, text) {
  if (node && node.textContent !== text) node.textContent = text;
}

function render() {
  setText(el.time, secs(S.elapsedMs));
  setText(el.best, S.bestMs === null ? "--" : secs(S.bestMs));
  setText(el.result, S.state === "RESULT" ? S.result : "");
  setText(el.newbest, S.state === "RESULT" && S.newBest ? "NEW BEST" : "");
  setText(el.start, S.state === "RACING" ? "RESTART" : "START");
  setText(el.speed, String(Math.round(S.playerSpeed * 3.6)));
  const gap = K.PLATFORM_START_M - S.playerPos;
  setText(el.togo, (gap > 0 ? Math.round(gap) : 0) + " m");
  if (el.throttle) el.throttle.classList.toggle("on", S.input.throttle);
  if (el.brake) el.brake.classList.toggle("on", S.input.brake);
  drawScene();
}

// ------------------------------------------------------------- the scene
// All art is code. The page loads no image file.

const VIEW_M = 260;      // metres across the canvas width
const NOSE_X = 0.35;     // the player nose sits here, as a fraction of width
const TRAIN_M = 30;      // the length of a train, in metres

const g = el.scene ? el.scene.getContext("2d") : null;
let cssW = 0, cssH = 0, dpr = 0, pal = null;

function readPalette() {
  const s = getComputedStyle(document.documentElement);
  const get = (n) => s.getPropertyValue(n).trim();
  return {
    ink: get("--ink"), muted: get("--muted"), edge: get("--edge"),
    panel: get("--panel"), accent: get("--accent"), bg: get("--bg")
  };
}

function sizeCanvas() {
  const w = el.scene.clientWidth;
  const h = el.scene.clientHeight;
  const d = window.devicePixelRatio || 1;
  if (w === cssW && h === cssH && d === dpr) return;
  cssW = w; cssH = h; dpr = d;
  el.scene.width = Math.max(1, Math.round(w * d));
  el.scene.height = Math.max(1, Math.round(h * d));
  pal = readPalette();
}

// A train is a locomotive and two coaches. The nose leads. Metres run left to
// right, so the coaches sit behind the nose at lower metre values.
function drawTrain(noseM, y, body, X, scale, tall) {
  if (X(noseM) < -60 || X(noseM - TRAIN_M) > cssW + 60) return;

  const box = (m1, m2, h, colour) => {
    g.fillStyle = colour;
    g.fillRect(X(m1), y - h, X(m2) - X(m1), h);
  };
  const wheels = (m1, m2, count) => {
    g.fillStyle = pal.ink;
    const r = Math.max(1.4, tall * 0.10);
    for (let i = 0; i < count; i += 1) {
      const m = m1 + ((m2 - m1) * (i + 0.5)) / count;
      g.beginPath(); g.arc(X(m), y - r * 0.6, r, 0, Math.PI * 2); g.fill();
    }
  };
  const windows = (m1, m2, count) => {
    g.fillStyle = pal.panel;
    const span = (m2 - m1) / count;
    for (let i = 0; i < count; i += 1) {
      const a = m1 + span * i + span * 0.25;
      g.fillRect(X(a), y - tall * 0.80, Math.max(1.5, X(a + span * 0.5) - X(a)), tall * 0.32);
    }
  };

  // two coaches, then the locomotive at the front
  box(noseM - 30, noseM - 22, tall * 0.86, body);
  windows(noseM - 30, noseM - 22, 3);
  wheels(noseM - 30, noseM - 22, 2);

  box(noseM - 21, noseM - 13, tall * 0.86, body);
  windows(noseM - 21, noseM - 13, 3);
  wheels(noseM - 21, noseM - 13, 2);

  // the locomotive: a long hood, a tall cab behind it, and a chimney
  box(noseM - 12, noseM - 1, tall * 0.72, body);
  box(noseM - 12, noseM - 7, tall * 1.20, body);
  windows(noseM - 11.5, noseM - 7.5, 1);
  box(noseM - 4.5, noseM - 3, tall * 1.05, body);      // the chimney
  wheels(noseM - 12, noseM - 1, 3);

  // the nose slope
  g.fillStyle = body;
  g.beginPath();
  g.moveTo(X(noseM - 1), y - tall * 0.72);
  g.lineTo(X(noseM), y - tall * 0.34);
  g.lineTo(X(noseM), y);
  g.lineTo(X(noseM - 1), y);
  g.closePath();
  g.fill();

  // the head lamp
  g.fillStyle = pal.panel;
  g.fillRect(X(noseM - 1.2), y - tall * 0.62, Math.max(1.5, X(noseM - 0.4) - X(noseM - 1.2)), tall * 0.16);
}

function drawStation(X, y, tall) {
  const a = X(K.PLATFORM_START_M);
  const b = X(K.PLATFORM_END_M);
  if (b < -40 || a > cssW + 40) return;
  const roofY = y - tall * 2.6;
  g.strokeStyle = pal.edge;
  g.lineWidth = 2;
  g.beginPath();
  g.moveTo(a, roofY); g.lineTo(b, roofY);
  g.moveTo(a + 6, roofY); g.lineTo(a + 6, y - tall * 1.3);
  g.moveTo(b - 6, roofY); g.lineTo(b - 6, y - tall * 1.3);
  g.stroke();
  g.fillStyle = pal.muted;
  g.font = "700 10px ui-monospace, monospace";
  g.fillText("STATION", a + 12, roofY - 5);
}

function drawRail(y, from, to, X) {
  g.strokeStyle = pal.edge;
  g.lineWidth = 2;
  g.beginPath(); g.moveTo(X(from), y); g.lineTo(X(to), y); g.stroke();
  g.lineWidth = 1;
  const first = Math.floor(from / 10) * 10;
  for (let m = first; m <= to; m += 10) {
    const x = X(m);
    g.beginPath(); g.moveTo(x, y - 4); g.lineTo(x, y + 4); g.stroke();
  }
}

function drawScene() {
  if (!g || !el.scene) return;
  sizeCanvas();
  if (cssW === 0 || cssH === 0) return;

  const W = cssW, H = cssH;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);

  const camMin = -30;
  const camMax = K.TRACK_LENGTH_M + 60 - VIEW_M;
  let camX = S.playerPos - VIEW_M * NOSE_X;
  if (camX < camMin) camX = camMin;
  if (camX > camMax) camX = camMax;

  const scale = W / VIEW_M;
  const X = (m) => (m - camX) * scale;
  const from = camX - 20;
  const to = camX + VIEW_M + 20;

  const rivalY = H * 0.36;
  const playerY = H * 0.82;
  const tall = Math.max(11, Math.min(22, H * 0.10));

  // a ground band under each rail, so the scene reads as two lanes
  g.globalAlpha = 0.5;
  g.fillStyle = pal.bg;
  g.fillRect(0, rivalY, W, H * 0.44 - 1);
  g.globalAlpha = 1;

  // the platform band, on the player track only
  const px1 = X(K.PLATFORM_START_M);
  const px2 = X(K.PLATFORM_END_M);
  if (px2 > -20 && px1 < W + 20) {
    g.globalAlpha = 0.16;
    g.fillStyle = pal.accent;
    g.fillRect(px1, playerY - tall - 10, px2 - px1, tall + 16);
    g.globalAlpha = 1;
    g.strokeStyle = pal.accent;
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(px1, playerY - tall - 10); g.lineTo(px1, playerY + 6);
    g.moveTo(px2, playerY - tall - 10); g.lineTo(px2, playerY + 6);
    g.stroke();
    g.fillStyle = pal.accent;
    g.font = "700 10px ui-monospace, monospace";
    g.fillText("PLATFORM", px1 + 8, playerY + 18);
  }

  drawRail(rivalY, from, to, X);
  drawRail(playerY, from, to, X);

  // the end of the rail
  const endX = X(K.TRACK_LENGTH_M);
  if (endX > -20 && endX < W + 20) {
    g.strokeStyle = pal.ink; g.lineWidth = 3;
    g.beginPath(); g.moveTo(endX, playerY - tall - 12); g.lineTo(endX, playerY + 6); g.stroke();
  }

  // distance markers every 100 m
  g.fillStyle = pal.muted;
  g.font = "10px ui-monospace, monospace";
  const firstMark = Math.ceil(from / 100) * 100;
  for (let m = firstMark; m <= to; m += 100) {
    if (m < 0 || m > K.TRACK_LENGTH_M) continue;
    const label = String(m);
    const lx = X(m) + 2;
    if (lx < 2) continue;                                    // never clip
    if (lx + g.measureText(label).width > W - 2) continue;
    g.fillText(label, lx, H - 4);
  }

  g.fillStyle = pal.muted;
  g.font = "700 10px ui-monospace, monospace";
  g.fillText("RIVAL", 6, rivalY - tall - 8);
  g.fillStyle = pal.accent;
  g.fillText("YOU", 6, playerY - tall - 26);

  drawStation(X, playerY, tall);
  drawTrain(S.rivalPos, rivalY, pal.muted, X, scale, tall);
  drawTrain(S.playerPos, playerY, pal.accent, X, scale, tall);
}

window.addEventListener("resize", () => { cssW = 0; drawScene(); });

// ------------------------------------------------------------------- input
// Touch and keys both call setInput(). They share one path.

function uiStart() {
  manual = false;              // the real animation loop owns the clock again
  lastFrameMs = 0;
  accMs = 0;
  if (S.state === "RACING") resetRace(); else startRace();
  render();
}

function bindControl(node, name) {
  if (!node) return;
  const on  = (e) => { if (e.cancelable) e.preventDefault(); setInput({ [name]: true }); };
  const off = () => setInput({ [name]: false });
  node.addEventListener("pointerdown", on);
  node.addEventListener("pointerup", off);
  node.addEventListener("pointercancel", off);
  node.addEventListener("pointerleave", off);
  node.addEventListener("lostpointercapture", off);
  node.addEventListener("touchcancel", off);
  node.addEventListener("touchend", off);
}

bindControl(el.throttle, "throttle");
bindControl(el.brake, "brake");

if (el.start) {
  el.start.addEventListener("pointerdown", (e) => {
    if (e.cancelable) e.preventDefault();
    uiStart();
  });
}

const KEY_MAP = {
  ArrowUp: "throttle", w: "throttle", W: "throttle",
  ArrowDown: "brake",  s: "brake",    S: "brake"
};

window.addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); uiStart(); return; }
  const name = KEY_MAP[e.key];
  if (name) { e.preventDefault(); setInput({ [name]: true }); }
});

window.addEventListener("keyup", (e) => {
  const name = KEY_MAP[e.key];
  if (name) setInput({ [name]: false });
});

// A lost window must never leave a control held.
window.addEventListener("blur", () => setInput({ throttle: false, brake: false }));

let manual = false;
let lastFrameMs = 0;
let accMs = 0;

function frame(nowMs) {
  if (!manual) {
    let delta = lastFrameMs === 0 ? 0 : nowMs - lastFrameMs;
    lastFrameMs = nowMs;
    if (delta > K.MAX_FRAME_DELTA_MS) delta = K.MAX_FRAME_DELTA_MS;
    if (delta < 0) delta = 0;
    accMs += delta;
    while (accMs >= K.STEP_MS) { step(); accMs -= K.STEP_MS; }
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.__drivetrain = {
  get state()       { return S.state; },
  get result()      { return S.result; },
  get playerPos()   { return S.playerPos; },
  get playerSpeed() { return S.playerSpeed; },
  get rivalPos()    { return S.rivalPos; },
  get rivalDone()   { return S.rivalDone; },
  get elapsedMs()   { return S.elapsedMs; },
  get bestMs()      { return S.bestMs; },
  track: {
    length:        K.TRACK_LENGTH_M,
    platformStart: K.PLATFORM_START_M,
    platformEnd:   K.PLATFORM_END_M
  },
  test: {
    start() { manual = true; startRace(); },
    setInput(next) { setInput(next); },
    step(n) { manual = true; for (let i = 0; i < n; i += 1) step(); },
    reset() { manual = true; resetRace(); }
  }
};
</script>
